    <!-- CSS crítico inline: se aplica antes de que Vite inyecte los stylesheets -->
    <style>
      html { color-scheme: light; background: #FAFBFC; }
      html.dark { color-scheme: dark; background: #0A1628; }
      body { margin: 0; background: inherit; color: #0A1628; font-family: var(--font-sans, 'DM Sans', system-ui, sans-serif); }
      html.dark body { color: #E2E8F0; }
    </style>

    <!-- Aplicar tema antes de montar React para evitar FOUC -->
    <script>
      (function () {
        try {
          var cached = localStorage.getItem('openfactu_theme');
          if (cached) {
            // Lo deja ThemeContext: las variables y atributos que escribió
            // applyTheme la última vez, para no pintar el tema de fábrica.
            var parsed = JSON.parse(cached);
            var root = document.documentElement;
            if (parsed && parsed.themeMode === 'dark') {
              root.classList.add('dark');
              root.style.colorScheme = 'dark';
            }
            if (parsed && parsed.vars) {
              for (var name in parsed.vars) root.style.setProperty(name, parsed.vars[name]);
              if (parsed.themeMode === 'dark' && !(parsed.attrs && 'data-k-backdrop' in parsed.attrs) && parsed.vars['--bg-app']) {
                root.style.background = parsed.vars['--bg-app'];
              }
            }
            if (parsed && parsed.attrs) {
              for (var attr in parsed.attrs) root.setAttribute(attr, parsed.attrs[attr]);
            }
            if (parsed && parsed.appName) {
              document.title = parsed.appName;
            }
            if (parsed && parsed.fontUrl) {
              // Mismo atributo que usa applyTheme, que así reutiliza este <link>.
              var fontLink = document.createElement('link');
              fontLink.rel = 'stylesheet';
              fontLink.href = parsed.fontUrl;
              fontLink.setAttribute('data-openfactu-font', '');
              document.head.appendChild(fontLink);
            }
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Import Map para Plugins Dinámicos -->
