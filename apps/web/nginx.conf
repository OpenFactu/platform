server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para las peticiones a la API del Backend
    location /api {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # La IP del cliente: sin esto el servidor ve siempre la de este contenedor y el freno
        # por IP se vuelve uno solo para todo el mundo (ver TRUST_PROXY en docker-compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Eventos en vivo del ERP (/ws/events): websocket de larga duración.
    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # La IP del cliente: sin esto el servidor ve siempre la de este contenedor y el freno
        # por IP se vuelve uno solo para todo el mundo (ver TRUST_PROXY en docker-compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Mensajería (servicio Rust): REST en /rt/v1 y websocket en /rt/ws.
    location /rt {
        proxy_pass http://messaging:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # La IP del cliente: sin esto el servidor ve siempre la de este contenedor y el freno
        # por IP se vuelve uno solo para todo el mundo (ver TRUST_PROXY en docker-compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        client_max_body_size 2m;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
