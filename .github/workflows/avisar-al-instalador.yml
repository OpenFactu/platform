name: Avisar al instalador

# Al publicar una release de Keirost, pide al repositorio del instalador que
# compile y publique sus artefactos con esa misma etiqueta.
#
# Sin esto son dos pasos manuales —publicar aquí y acordarse de ir allí a lanzar
# el pipeline— y olvidar el segundo deja una versión publicada que nadie puede
# instalar, sin ninguna señal de que falta algo.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a empaquetar (por ejemplo v0.0.14)'
        required: true

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      # El GITHUB_TOKEN de un workflow sólo vale para su propio repositorio, así
      # que hace falta una credencial que alcance al del instalador. Se usa una
      # GitHub App de la organización y no un token personal: el token efímero
      # que emite dura una hora, no caduca «algún día» a media noche y no queda
      # atado a la cuenta de nadie.
      - name: Pedir un token a la App
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KEIROST_APP_ID }}
          private-key: ${{ secrets.KEIROST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: destokp-program-and-setup

      - name: Pedir los artefactos de esta versión
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ETIQUETA: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # La versión de los artefactos es la etiqueta sin la «v»: así el
          # número de Keirost y el del paquete que se instala son el mismo.
          VERSION="${ETIQUETA#v}"
          echo "Pidiendo artefactos de $ETIQUETA como $VERSION"

          gh workflow run artifacts.yml \
            --repo ${{ github.repository_owner }}/destokp-program-and-setup \
            --ref main \
            -f platform_ref="$ETIQUETA" \
            -f keirost_version="$VERSION" \
            -f channel=stable \
            -f node_version=22.23.1 \
            -f postgres_url='https://get.enterprisedb.com/postgresql/postgresql-15.14-1-windows-x64-binaries.zip' \
            -f publish=true

          echo "Lanzado. Tarda unos 40 minutos:"
          echo "https://github.com/${{ github.repository_owner }}/destokp-program-and-setup/actions/workflows/artifacts.yml"
